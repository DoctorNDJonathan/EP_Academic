# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Render asks for DATABASE_URL (the Supabase "Session pooler" connection string).
services:
  - type: web
    name: exam-proctor
    runtime: python
    plan: free
    region: singapore            # keep it in the same region as your Supabase project
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # One worker: the rate limiter and the offline watcher live in this process.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PROCTOR_ENV
        value: production
      - key: PROCTOR_SECRET      # generated once by Render; never change it after the first exam
        generateValue: true
      - key: DATABASE_URL
        sync: false
